[package]
name = "tde"
version = "0.1.0"
edition = "2024"
description = "A lightweight, terminal-native desktop environment"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
crossterm = "0.29"
ratatui = "0.29"
sysinfo = "0.37"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
portable-pty = "0.9"
vt100 = "0.15"
