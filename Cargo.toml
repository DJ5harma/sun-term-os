[package]
name = "sun-term-os"
version = "0.1.0"
edition = "2024"
description = "sun-term-os — a lightweight, terminal-native desktop environment"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
trash = "5"
crossterm = "0.29"
ratatui = "0.29"
sysinfo = "0.37"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
portable-pty = "0.9"
vt100 = "0.15"
notify = "8.0"
russh = "0.63"
russh-sftp = "3.0"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.20"
